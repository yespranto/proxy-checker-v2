expose_php = Off
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2
memory_limit = 256M
max_execution_time = 120
date.timezone = UTC
session.use_strict_mode = 1
session.cookie_httponly = 1
session.cookie_samesite = Lax
disable_functions = proc_open,exec,shell_exec,system,passthru,popen
